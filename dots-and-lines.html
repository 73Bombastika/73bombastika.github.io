<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Точки и линии</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    h1 { margin-bottom: 20px; }
    .dots-container {
      width: 200px;
      height: 200px;
      position: relative;
      border: 1px solid #444;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(5, 1fr);
    }
    .dot {
      width: 12px;
      height: 12px;
      background-color: #0ff;
      border-radius: 50%;
      margin: auto;
      transition: transform 0.3s ease;
    }
    .dot:hover {
      transform: scale(1.5);
      background-color: #f0f;
    }
    .line-box {
      margin-top: 30px;
      width: 200px;
      height: 200px;
      position: relative;
      border: 1px solid #444;
    }
    .line {
      position: absolute;
      width: 100%;
      height: 2px;
      background: #0ff;
      opacity: 0.8;
    }
    .back-link {
      margin-top: 40px;
      color: #0ff;
      text-decoration: none;
      font-size: 16px;
    }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>Точки и линии</h1>

  <div class="dots-container">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>

  <div class="line-box">
    <div class="line" style="top: 20%; transform: rotate(15deg);"></div>
    <div class="line" style="top: 40%; transform: rotate(-15deg);"></div>
    <div class="line" style="top: 60%; transform: skewY(20deg);"></div>
    <div class="line" style="top: 80%; transform: skewY(-20deg);"></div>
  </div>

  <a href="index.html" class="back-link">← Назад к экспериментам</a>
</body>
</html>
